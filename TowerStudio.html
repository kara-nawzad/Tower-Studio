const cam=new T.OrthographicCamera(-1,1,1,-1,.1,500),K=.26,cs={th:1,ph:.98,s:22,t:V3(0,2,0)},go={th:1,ph:.98,s:22,t:V3(0,2,0)};
function views(){const h=st.tw?st.H:20,s0=16+h*.62,b=st.tw==='cow'?2.2:0;return[{th:1,ph:.98,s:24,t:[0,2,0]},{th:1,ph:.98,s:s0,t:[0,h*.45,0]},{th:.5,ph:1,s:15,t:[-6,2,3]},{th:1.2,ph:1.15,s:7.4,t:[9,2.8,4]},{th:-.6,ph:1.05,s:12,t:[Math.cos(-.9)*2,b+h*.7,Math.sin(-.9)*2]},{th:1,ph:1,s:9,t:[st.tw==='cow'?-2.2:0,b+h+1.6,0]},{th:1,ph:.98,s:s0,t:[0,h*.45,0]}];}
function camTo(){const p=views()[st.step];cs.th+=Math.round((p.th-cs.th)/6.2832)*6.2832;go.th=p.th;go.ph=p.ph;go.s=p.s;go.t.set(...p.t);}
function goStep(n){st.step=Math.max(0,Math.min(6,n));st.max=Math.max(st.max,st.step);st.slotSel=null;camTo();rebuild();render();}
// input
const RC=new T.Raycaster(),pts=new Map(),cv=$('#c');let lx,ly,pd=0,mv=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);lx=e.clientX;ly=e.clientY;mv=0;});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size===2){const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)go.s=Math.min(70,Math.max(3,go.s*pd/d));pd=d;mv=99;return;}
 mv+=Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly);go.th-=(e.clientX-lx)*.006;go.ph=Math.min(1.35,Math.max(.7,go.ph-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY;});
cv.addEventListener('pointerup',e=>{pts.delete(e.pointerId);pd=0;if(mv>8)return;RC.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
 const Q=[];S.traverse(o=>{if(o.userData.pick)Q.push(o)});const h=RC.intersectObjects(Q,false)[0];if(!h)return;const p=h.object.userData.pick;
 if(p.t==='mod'&&st.step===3)act('slot',p.i);if(p.t==='ant'&&st.step===5)act('sec',p.i);});
cv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);pd=0});
cv.addEventListener('wheel',e=>{e.preventDefault();go.s=Math.min(70,Math.max(3,go.s*(1+e.deltaY*.001)))},{passive:false});
const size=()=>R.setSize(innerWidth,innerHeight,false);addEventListener('resize',size);size();
const clk=new T.Clock();
function tick(){const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime,k=1-Math.pow(.003,dt);
 cs.th+=(go.th-cs.th)*k;cs.ph+=(go.ph-cs.ph)*k;cs.s+=(go.s-cs.s)*k;cs.t.lerp(go.t,k);
 const a=innerWidth/innerHeight,s=cs.s;cam.left=-s*a;cam.right=s*a;cam.top=s*(1-K);cam.bottom=-s*(1+K);cam.updateProjectionMatrix();
 cam.position.set(cs.t.x+150*Math.sin(cs.ph)*Math.cos(cs.th),cs.t.y+150*Math.cos(cs.ph),cs.t.z+150*Math.sin(cs.ph)*Math.sin(cs.th));cam.lookAt(cs.t);
 if(tg&&gp<.999){gp+=(1-gp)*(1-Math.pow(.02,dt));tg.scale.y=Math.max(gp,.01);ap.position.y=TWR.by+(gp-1)*TWR.h;if(cabG&&cabG.userData.links)cabG.userData.links.visible=gp>.97;}
 if(hinge)hinge.rotation.y+=((st.step===3?-2.05:0)-hinge.rotation.y)*(1-Math.pow(.01,dt));
 mods.forEach((g,i)=>{const w=st.slotSel===i?.5:.05;g.position.z+=(w-g.position.z)*(1-Math.pow(.001,dt));});
 const c=st.air&&calc().ok;pool.forEach((m,i)=>{const p=pulses[i];m.visible=!!p&&c&&gp>.97;if(p){p.t=(p.t+dt*p.s*.6)%1;m.position.copy(p.c.getPoint(p.t));}});
 blink.forEach((l,i)=>l.material.color.setHex(Math.sin(t*(4+i%3*2)+i)>-.2?0x2fb58c:0x1c5a46));ants.forEach((q,i)=>q.cm.opacity=.1+.06*Math.sin(t*1.7+i*2));if(bc)bc.material.color.setHex(Math.sin(t*3)>0?0xe5483c:0xf6b3ac);
 R.render(S,cam);placeCO();requestAnimationFrame(tick);}
goStep(0);tick();
</script></body></html>
